<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixou</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/base.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; user-select: none; }
  input, .selectable { user-select: text; }

  .shell { display: grid; grid-template-columns: 228px 1fr; height: 100vh; }

  /* ---------- menu lateral ---------- */
  .side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px; }
  .side .logo { padding: 4px 10px 18px; }
  .nav-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent;
    padding: 11px 12px; border-radius: 12px; font-weight: 600; font-size: .95rem; color: var(--muted); cursor: pointer; text-align: left;
  }
  .nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .nav-btn .n { margin-left: auto; font-size: .75rem; font-weight: 700; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .nav-btn[aria-current="page"] .n { background: var(--accent); color: var(--accent-ink); }
  .nav-btn .n:empty { display: none; }
  .nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
  .side-foot { margin-top: auto; padding: 12px 10px 0; font-size: .78rem; color: var(--muted); line-height: 1.4; }
  .side-foot b { display: block; color: var(--ink); font-weight: 600; word-break: break-all; }
  .auth-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-left: auto; }
  .auth-dot.on { background: var(--ok); }

  /* ---------- área principal ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
  .paste-btn { padding: .75em 1.3em; font-size: 1rem; box-shadow: 0 4px 14px -4px var(--accent); }
  .paste-btn svg { width: 18px; height: 18px; }
  .url-box { flex: 1; min-width: 220px; display: flex; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 0 6px 0 16px; border: 1.5px solid transparent; }
  .url-box:focus-within { border-color: var(--accent); background: var(--surface); }
  .url-box input { flex: 1; min-width: 0; border: 0; background: transparent; padding: .7em 0; outline: none; }
  .url-box input::placeholder { color: var(--muted); }
  .url-box button { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: .4em .9em; font-weight: 700; font-size: .85rem; cursor: pointer; }
  .url-box button:disabled { opacity: .3; cursor: default; }

  .preset { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: .88rem; color: var(--muted); background: var(--bg); }
  .preset .lbl { font-weight: 600; }
  .preset select { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: .4em .6em; font-weight: 600; color: var(--ink); }
  .chip-toggle { display: inline-flex; align-items: center; gap: .4em; padding: .35em .8em; border-radius: 999px; border: 1.5px solid var(--line); cursor: pointer; font-weight: 600; color: var(--muted); background: var(--surface); }
  .chip-toggle:has(input:checked) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .chip-toggle input { display: none; }
  .preset .sp { flex: 1; }

  .view { flex: 1; overflow-y: auto; padding: 18px 20px 100px; }
  .view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .view-head h1 { font-size: 1.5rem; font-weight: 800; }
  .linkish { border: 0; background: none; color: var(--muted); font-size: .88rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- lista ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: 128px 1fr auto; gap: 16px; align-items: center; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .item .thumb { position: relative; aspect-ratio: 16/9; border-radius: 9px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
  .item .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .item .thumb .kind { position: absolute; left: 6px; bottom: 6px; font-size: .68rem; font-weight: 800; letter-spacing: .03em; background: rgba(0,0,0,.72); color: #fff; padding: 1px 6px; border-radius: 5px; }
  .item .body { min-width: 0; }
  .item .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .s { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .82rem; color: var(--muted); margin-top: 3px; }
  .item .s .err { color: var(--err); white-space: normal; }
  .item .s .ok { color: var(--ok); font-weight: 700; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 9px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
  .bar.indet i { width: 30% !important; animation: indet 1.1s ease-in-out infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .acts { display: flex; gap: 4px; }
  .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.play { background: var(--accent-soft); color: var(--accent); }
  .icon-btn svg { width: 19px; height: 19px; }

  .empty { text-align: center; padding: 64px 20px; color: var(--muted); }
  .empty .art { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 28px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); }
  .empty .art svg { width: 44px; height: 44px; }
  .empty h2 { color: var(--ink); font-size: 1.3rem; margin-bottom: 6px; }
  .empty kbd { font: 600 .85em var(--font-body); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 .4em; color: var(--ink); }

  /* ---------- login ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; max-width: 640px; }
  .hint { color: var(--muted); font-size: .92rem; margin: 0 0 16px; }
  .hint.small { font-size: .84rem; margin: 12px 0 0; }
  .auth-options { display: flex; flex-direction: column; gap: 8px; }
  .auth-options label { display: flex; align-items: center; gap: .7em; padding: .8em 1em; border-radius: 12px; border: 1.5px solid var(--line); cursor: pointer; font-weight: 600; }
  .auth-options label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .auth-options input { accent-color: var(--accent); margin: 0; width: 18px; height: 18px; }
  .cookie-box { margin-top: 16px; padding: 16px; border-radius: 12px; background: var(--surface-2); }
  .cookie-box .ok { color: var(--ok); font-weight: 700; }
  .steps-mini { margin: 10px 0 14px; padding-left: 1.3em; color: var(--muted); font-size: .9rem; }
  .steps-mini b { color: var(--ink); }
  .upload { cursor: pointer; padding: .6em 1.2em; font-size: .92rem; }

  /* ---------- navegador ---------- */
  .panel.wide { max-width: 760px; }
  .url-box.big { margin-bottom: 16px; }
  .sites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .site-tile { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-align: left; }
  .site-tile:hover { border-color: var(--accent); background: var(--accent-soft); }
  .site-tile .ini { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font: 800 1rem var(--font-display); flex-shrink: 0; }
  .site-tile small { display: block; font-weight: 500; color: var(--muted); font-size: .75rem; }

  /* ---------- aviso flutuante ---------- */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: .75em 1.2em; border-radius: 12px; font-weight: 600; font-size: .92rem; max-width: min(520px, calc(100vw - 32px)); transition: .25s; z-index: 50; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--err); color: #fff; }

  .fab, .tabbar { display: none; }

  /* ---------- celular: estilo app (abas embaixo + botão +) ---------- */
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    .side { display: none; }
    .toolbar { padding: 12px 16px; }
    .toolbar .paste-btn { display: none; }
    .url-box { min-width: 0; }
    .mobile-logo { display: flex !important; }
    .preset { padding: 8px 16px; overflow-x: auto; flex-wrap: nowrap; white-space: nowrap; }
    .preset .sp, .preset .lbl { display: none; }
    .view { padding: 14px 16px 150px; }
    .item { grid-template-columns: 88px 1fr; gap: 12px; }
    .item .acts { grid-column: 1 / -1; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 6px; margin-top: -2px; }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 20;
    }
    .tabbar .nav-btn { flex-direction: column; gap: 3px; font-size: .72rem; padding: 6px 4px; align-items: center; text-align: center; position: relative; }
    .tabbar .nav-btn .n { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; font-size: .65rem; padding: 0 5px; min-width: 0; }
    .tabbar .nav-btn[aria-current="page"] { background: transparent; }
    .fab {
      display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 20px;
      background: var(--accent); color: var(--accent-ink); border: 0; box-shadow: 0 10px 24px -6px var(--accent); cursor: pointer; z-index: 21;
    }
    .fab svg { width: 28px; height: 28px; }
    .toast { bottom: calc(150px + env(safe-area-inset-bottom)); }
  }
  .mobile-logo { display: none; align-items: center; gap: .45rem; font: 800 1.15rem var(--font-display); }
  .mobile-logo img { width: 28px; height: 28px; }
</style>
</head>
<body>

  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M16.5 6.5l2.5 2.5M14 9l2 2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.6 3.5 5.4 3.5 8.5s-1.1 5.9-3.5 8.5c-2.4-2.6-3.5-5.4-3.5-8.5s1.1-5.9 3.5-8.5z"/></symbol>

  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l1 12a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-12M9.5 7V4.8h5V7"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3"/></symbol>

</svg>

<div class="shell">
  <aside class="side">
    <div class="logo"><img src="/assets/logo.svg" alt="" width="32" height="32">Baixou</div>
    <button class="nav-btn" data-view="active" aria-current="page"><svg><use href="#i-down"/></svg>Baixando<span class="n" data-count="active"></span></button>
    <button class="nav-btn" data-view="done"><svg><use href="#i-check"/></svg>Concluídos<span class="n" data-count="done"></span></button>
    <div class="nav-sep"></div>
    <button class="nav-btn" data-view="browser"><svg><use href="#i-globe"/></svg>Navegador</button>
    <button class="nav-btn" data-view="login"><svg><use href="#i-key"/></svg>Login<span class="auth-dot" data-auth-dot></span></button>
    <button class="nav-btn" id="openFolder"><svg><use href="#i-folder"/></svg>Abrir pasta</button>
    <div class="side-foot">Salvando em<b id="folderPath" class="selectable">Downloads\Baixou</b></div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <div class="mobile-logo"><img src="/assets/logo.svg" alt="">Baixou</div>
      <button class="btn btn-primary paste-btn" id="pasteBtn" type="button" title="Cola o link copiado e já começa a baixar"><svg><use href="#i-plus"/></svg>Colar link</button>
      <form class="url-box" id="urlForm">
        <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="Cole ou digite um link" aria-label="Link do vídeo">
        <button type="submit" id="urlGo" disabled>Baixar</button>
      </form>
    </div>

    <div class="preset">
      <span class="lbl">Baixar como</span>
      <select id="pFormat" aria-label="Formato">
        <optgroup label="Vídeo">
          <option value="video:mp4">🎬 Vídeo MP4</option>
          <option value="video:mkv">🎬 Vídeo MKV</option>
          <option value="video:webm">🎬 Vídeo WEBM</option>
        </optgroup>
        <optgroup label="Só áudio">
          <option value="audio:mp3">🎵 Áudio MP3</option>
          <option value="audio:m4a">🎵 Áudio M4A</option>
          <option value="audio:wav">🎵 Áudio WAV</option>
        </optgroup>
      </select>
      <select id="pQuality" aria-label="Qualidade">
        <option value="best">Melhor qualidade</option>
        <option value="4320">8K</option>
        <option value="2160">4K</option>
        <option value="1440">2K</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
      <label class="chip-toggle" title="Baixa todos os vídeos quando o link for de uma playlist"><input type="checkbox" id="pPlaylist">📚 Playlist inteira</label>
      <label class="chip-toggle" title="Baixa legendas em português e inglês (arquivo .srt)"><input type="checkbox" id="pSubs">💬 Legendas</label>
      <span class="sp"></span>
    </div>

    <main class="view" id="view"></main>
  </div>
</div>

<button class="fab" id="fab" type="button" aria-label="Colar link e baixar"><svg><use href="#i-plus"/></svg></button>
<nav class="tabbar">
  <button class="nav-btn" data-view="active" aria-current="page"><svg><use href="#i-down"/></svg>Baixando<span class="n" data-count="active"></span></button>
  <button class="nav-btn" data-view="done"><svg><use href="#i-check"/></svg>Concluídos<span class="n" data-count="done"></span></button>
  <button class="nav-btn" data-view="browser"><svg><use href="#i-globe"/></svg>Navegador</button>
  <button class="nav-btn" data-view="login"><svg><use href="#i-key"/></svg>Login</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="browserTpl">
  <div class="view-head"><h1>Navegador</h1></div>
  <div class="panel wide">
    <p class="hint">Entre nas suas contas por aqui e baixe com um clique no botão <b>⬇ Baixar este vídeo</b>, que aparece no canto de cada página. Não precisa de extensão nem de cookies.txt: o login fica guardado só no Baixou, separado do seu navegador.</p>
    <form class="url-box big" id="browseForm">
      <input id="browseUrl" type="text" inputmode="url" autocomplete="off" placeholder="Digite um endereço (ex.: instagram.com)" aria-label="Endereço">
      <button type="submit">Abrir</button>
    </form>
    <div class="sites-grid" id="sitesGrid"></div>
    <p class="hint small">O formato e a qualidade são os mesmos de "Baixar como", lá em cima.</p>
    <div class="cookie-box" id="browserUnavailable" hidden><b>O navegador interno só funciona no programa Baixou.</b> Abra o Baixou pelo atalho do Menu Iniciar ou da Área de Trabalho.</div>
    <p class="hint small"><button class="linkish" type="button" id="browserLogout">Sair de todas as contas do navegador interno</button></p>
  </div>
</template>

<template id="loginTpl">
  <div class="view-head"><h1>Login</h1></div>
  <div class="panel">
    <p class="hint">Para vídeos privados, só para membros ou de sites que exigem conta (Vimeo, Instagram…). O login fica só no seu computador.</p>
    <div class="auth-options" id="authOptions" role="radiogroup" aria-label="Fonte do login"></div>
    <p class="hint small" id="chromiumNote" hidden>Chrome, Edge e Brave costumam bloquear essa leitura no Windows. Se der erro, use o arquivo cookies.txt.</p>
    <div class="cookie-box" id="cookieBox" hidden>
      <div id="cookieStatus"></div>
      <ol class="steps-mini">
        <li>Instale no seu navegador a extensão <b>Get cookies.txt LOCALLY</b>.</li>
        <li>Abra o site do vídeo já logado na sua conta.</li>
        <li>Clique na extensão, depois em <b>Export</b>, e envie o arquivo aqui.</li>
      </ol>
      <label class="btn btn-primary upload">📄 Enviar cookies.txt<input type="file" id="cookieInput" accept=".txt,text/plain" hidden></label>
    </div>
  </div>
</template>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ACTIVE = ["queued", "downloading", "processing"];
const state = { view: "active", jobs: [], auth: "none", browsers: [], hasCookieFile: false };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem armazenamento */ } },
};
const icon = (id) => `<svg><use href="#i-${id}"/></svg>`;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtDur(s) {
  if (!s) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
}
function fmtBytes(b) {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i > 1 ? 1 : 0) + " " + u[i];
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Algo deu errado (" + r.status + ")");
  return data;
}

let toastTimer;
function toast(text, kind) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "toast show " + (kind || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = "toast"), kind === "err" ? 5000 : 2600);
}

// ---------- preferências de download (lembradas) ----------
function loadPreset() {
  const p = JSON.parse(store.get("baixou.preset") || "{}");
  if (p.format) $("#pFormat").value = p.format;
  if (p.quality) $("#pQuality").value = p.quality;
  $("#pPlaylist").checked = !!p.playlist;
  $("#pSubs").checked = !!p.subs;
  syncPreset();
}
function syncPreset() {
  const audio = $("#pFormat").value.startsWith("audio");
  $("#pQuality").disabled = audio;
  $("#pQuality").style.opacity = audio ? .45 : 1;
  store.set("baixou.preset", JSON.stringify({ format: $("#pFormat").value, quality: $("#pQuality").value, playlist: $("#pPlaylist").checked, subs: $("#pSubs").checked }));
  // O navegador interno usa o mesmo formato: avisa o servidor.
  const [mode, format] = $("#pFormat").value.split(":");
  api("/api/preset", { preset: { mode, format, quality: $("#pQuality").value, playlist: $("#pPlaylist").checked, subs: $("#pSubs").checked } }).catch(() => {});
}
["#pFormat", "#pQuality", "#pPlaylist", "#pSubs"].forEach((s) => $(s).addEventListener("change", syncPreset));

// ---------- iniciar download (um clique) ----------
function isUrl(s) { return /^https?:\/\/\S+\.\S+/i.test(s || ""); }

async function startDownload(url) {
  url = (url || "").trim();
  if (!isUrl(url)) return toast("Isso não parece um link. Copie o endereço do vídeo e tente de novo.", "err");
  const [mode, format] = $("#pFormat").value.split(":");
  const options = { mode, format, quality: $("#pQuality").value, playlist: $("#pPlaylist").checked, subs: $("#pSubs").checked, auth: state.auth };
  try {
    await api("/api/download", { url, options });
    $("#url").value = ""; $("#urlGo").disabled = true;
    toast("Adicionado! Baixando…");
    show("active");
    poll();
  } catch (e) { toast(e.message, "err"); }
}

async function pasteAndGo() {
  let text = "";
  try { text = (await api("/api/clipboard")).text; } catch { /* sem acesso */ }
  if (!text) { try { text = await navigator.clipboard.readText(); } catch { /* bloqueado */ } }
  if (!isUrl(text)) return toast("Copie o link de um vídeo primeiro (Ctrl+C) e clique de novo.", "err");
  startDownload(text);
}

// ---------- telas ----------
function show(view) {
  state.view = view;
  $$("[data-view]").forEach((b) => b.dataset.view === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  render();
}

function statusLine(j) {
  const kind = j.options.mode === "audio" ? j.options.format.toUpperCase() : (j.options.quality === "best" ? "Melhor" : j.options.quality + "p") + " · " + j.options.format.toUpperCase();
  const parts = [];
  if (j.options.source === "browser") parts.push("🌐 Navegador");
  if (j.site) parts.push(esc(j.site));
  parts.push(kind);
  if (j.count && j.options.playlist) parts.push(`vídeo ${j.index || "?"} de ${j.count}`);
  if (j.status === "queued") parts.push("Analisando o link…");
  else if (j.status === "processing") parts.push("Finalizando o arquivo…");
  else if (j.status === "downloading") {
    if (j.percent != null) parts.push(`<b>${j.percent.toFixed(0)}%</b>`);
    if (j.total) parts.push(fmtBytes(j.total));
    if (j.speed) parts.push(fmtBytes(j.speed) + "/s");
    if (j.eta) parts.push("falta " + fmtDur(j.eta));
  } else if (j.status === "done") parts.push('<span class="ok">✓ Pronto</span>' + (j.files.length > 1 ? ` · ${j.files.length} arquivos` : ""));
  else if (j.status === "cancelled") parts.push("Cancelado");
  else parts.push(`<span class="err">${esc(j.error || "Erro")}</span>`);
  return parts.map((p) => `<span>${p}</span>`).join("");
}

function itemHTML(j) {
  const active = ACTIVE.includes(j.status);
  const indet = j.status !== "downloading" || j.percent == null;
  const kindIcon = j.options.mode === "audio" ? "music" : "video";
  let acts = "";
  if (active) acts = `<button class="icon-btn" data-act="cancel" title="Cancelar">${icon("x")}</button>`;
  else if (j.status === "done") acts = `
    <button class="icon-btn play" data-act="play" title="Abrir">${icon("play")}</button>
    <button class="icon-btn" data-act="reveal" title="Mostrar na pasta">${icon("folder")}</button>
    <button class="icon-btn" data-act="remove" title="Tirar da lista (o arquivo continua salvo)">${icon("trash")}</button>`;
  else acts = `
    <button class="icon-btn" data-act="retry" title="Tentar de novo">${icon("retry")}</button>
    <button class="icon-btn" data-act="remove" title="Tirar da lista">${icon("trash")}</button>`;
  return `<div class="item" data-id="${j.id}">
    <div class="thumb">${icon(kindIcon)}${j.thumbnail ? `<img src="${esc(j.thumbnail)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">` : ""}<span class="kind">${j.options.mode === "audio" ? "ÁUDIO" : "VÍDEO"}</span></div>
    <div class="body">
      <div class="t selectable" title="${esc(j.title || j.url)}">${esc(j.title || j.url)}</div>
      <div class="s">${statusLine(j)}</div>
      ${active ? `<div class="bar ${indet ? "indet" : ""}"><i style="width:${j.percent || 0}%"></i></div>` : ""}
    </div>
    <div class="acts">${acts}</div>
  </div>`;
}

function render() {
  const active = state.jobs.filter((j) => ACTIVE.includes(j.status));
  const done = state.jobs.filter((j) => !ACTIVE.includes(j.status));
  $$('[data-count="active"]').forEach((e) => (e.textContent = active.length || ""));
  $$('[data-count="done"]').forEach((e) => (e.textContent = done.length || ""));

  const v = $("#view");
  if (state.view === "browser") {
    if (!$("#sitesGrid", v)) { v.innerHTML = ""; v.append($("#browserTpl").content.cloneNode(true)); bindBrowser(); }
    return;
  }
  if (state.view === "login") {
    if (!$("#authOptions", v)) { v.innerHTML = ""; v.append($("#loginTpl").content.cloneNode(true)); bindLogin(); renderLogin(); }
    return;
  }
  const list = state.view === "active" ? active : done;
  const title = state.view === "active" ? "Baixando" : "Concluídos";
  const clear = state.view === "done" && done.length ? `<button class="linkish" id="clearBtn">Limpar lista</button>` : "";
  if (!list.length) {
    v.innerHTML = `<div class="view-head"><h1>${title}</h1></div>` + (state.view === "active"
      ? `<div class="empty"><div class="art">${icon("down")}</div><h2>Copiou, colou, baixou.</h2>
         <p>Copie o link de um vídeo (YouTube, Instagram, TikTok, X…)<br>e clique em <b>Colar link</b>, ou aperte <kbd>Ctrl</kbd> + <kbd>V</kbd> em qualquer lugar.</p></div>`
      : `<div class="empty"><div class="art">${icon("check")}</div><h2>Nada por aqui ainda</h2><p>Os downloads prontos aparecem aqui.</p></div>`);
    return;
  }
  v.innerHTML = `<div class="view-head"><h1>${title}</h1>${clear}</div><div class="list">${list.map(itemHTML).join("")}</div>`;
}

// ---------- fila ----------
let pollTimer;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const data = await api("/api/jobs");
    const before = new Map(state.jobs.map((j) => [j.id, j.status]));
    state.jobs = data.jobs;
    $("#folderPath").textContent = data.folder;
    for (const j of state.jobs) {
      if (ACTIVE.includes(before.get(j.id)) && j.status === "done") toast("✓ " + (j.title || "Download") + " — pronto!");
      if (ACTIVE.includes(before.get(j.id)) && j.status === "error") toast("Não deu para baixar: " + (j.error || "erro"), "err");
    }
    render();
  } catch { /* servidor desligado */ }
  pollTimer = setTimeout(poll, state.jobs.some((j) => ACTIVE.includes(j.status)) ? 800 : 3000);
}

$("#view").addEventListener("click", async (e) => {
  if (e.target.id === "clearBtn") { await api("/api/clear", {}); return poll(); }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.closest(".item").dataset.id;
  const job = state.jobs.find((j) => j.id === id);
  try {
    if (btn.dataset.act === "cancel") await api("/api/cancel", { id });
    if (btn.dataset.act === "remove") await api("/api/remove", { id });
    if (btn.dataset.act === "retry") { await api("/api/retry", { id }); show("active"); }
    if (btn.dataset.act === "play") await api("/api/open-file", { path: job.files[job.files.length - 1] });
    if (btn.dataset.act === "reveal") await api("/api/open-file", { path: job.files[job.files.length - 1], reveal: true });
  } catch (err) { toast(err.message, "err"); }
  poll();
});

// ---------- navegador interno ----------
const SITES = [
  ["YouTube", "youtube.com", "#E1306C", "https://www.youtube.com"],
  ["Instagram", "instagram.com", "#C13584", "https://www.instagram.com"],
  ["TikTok", "tiktok.com", "#111111", "https://www.tiktok.com"],
  ["Facebook", "facebook.com", "#1877F2", "https://www.facebook.com"],
  ["X", "x.com", "#333333", "https://x.com"],
  ["Vimeo", "vimeo.com", "#1AB7EA", "https://vimeo.com"],
  ["Twitch", "twitch.tv", "#9146FF", "https://www.twitch.tv"],
  ["SoundCloud", "soundcloud.com", "#FF7700", "https://soundcloud.com"],
];
async function openBrowser(url) {
  try { await api("/api/browser/open", { url }); toast("Abrindo o navegador…"); }
  catch (e) { toast(e.message, "err"); }
}
function bindBrowser() {
  $("#browserUnavailable").hidden = state.browserAvailable;
  $("#sitesGrid").innerHTML = SITES.map(([name, host, color, url]) =>
    `<button class="site-tile" type="button" data-url="${url}"><span class="ini" style="background:${color}">${name[0]}</span><span>${name}<small>${host}</small></span></button>`).join("");
  $("#sitesGrid").addEventListener("click", (e) => { const t = e.target.closest("[data-url]"); if (t) openBrowser(t.dataset.url); });
  $("#browseForm").addEventListener("submit", (e) => { e.preventDefault(); const u = $("#browseUrl").value.trim(); if (u) openBrowser(u); });
  $("#browserLogout").addEventListener("click", async () => {
    try { await api("/api/browser/logout", {}); toast("Você saiu de todas as contas do navegador interno."); }
    catch (err) { toast(err.message, "err"); }
  });
}

// ---------- login ----------
const CHROMIUM = ["chrome", "edge", "brave", "opera", "vivaldi"];
function authLabel(a) { return a === "file" ? "cookies.txt" : state.browsers.find((b) => b.id === a)?.label || "Login"; }

async function loadSettings() {
  try { const s = await api("/api/settings"); state.browsers = s.browsers; state.hasCookieFile = s.has_cookie_file; state.browserAvailable = s.browser_available; } catch { /* fora do ar */ }
  const saved = store.get("baixou.auth") || "none";
  state.auth = saved === "none" || saved === "file" || state.browsers.some((b) => b.id === saved) ? saved : "none";
  updateAuthDot();
}
function updateAuthDot() {
  const on = state.auth !== "none" && (state.auth !== "file" || state.hasCookieFile);
  $$("[data-auth-dot]").forEach((d) => { d.classList.toggle("on", on); d.title = on ? "Usando " + authLabel(state.auth) : "Sem login"; });
}
function setAuth(a) { state.auth = a; store.set("baixou.auth", a); updateAuthDot(); renderLogin(); }

function renderLogin() {
  if (!$("#authOptions")) return;
  const a = state.auth;
  const opts = [{ id: "none", label: "Sem login (vídeos públicos)" }, ...state.browsers.map((b) => ({ id: b.id, label: "Usar o login do " + b.label })), { id: "file", label: "Usar um arquivo cookies.txt" }];
  $("#authOptions").innerHTML = opts.map((o) => `<label><input type="radio" name="auth" value="${o.id}" ${o.id === a ? "checked" : ""}>${esc(o.label)}</label>`).join("");
  $("#chromiumNote").hidden = !CHROMIUM.includes(a);
  $("#cookieBox").hidden = a !== "file";
  $("#cookieStatus").innerHTML = state.hasCookieFile
    ? '<span class="ok">✓ cookies.txt carregado</span> <button class="linkish" type="button" id="cookieDel">Remover</button>'
    : "<b>Nenhum arquivo enviado ainda.</b>";
}
function bindLogin() {
  $("#authOptions").addEventListener("change", (e) => setAuth(e.target.value));
  $("#cookieInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const r = await api("/api/cookies-file", { content: await file.text() });
      state.hasCookieFile = true; setAuth("file");
      toast(`Login salvo (${r.count} cookies).`);
    } catch (err) { toast(err.message, "err"); }
    e.target.value = "";
  });
  $("#cookieBox").addEventListener("click", async (e) => {
    if (e.target.id !== "cookieDel") return;
    await api("/api/cookies-file/delete", {});
    state.hasCookieFile = false; setAuth("file");
  });
}

// ---------- eventos ----------
$$("[data-view]").forEach((b) => b.addEventListener("click", () => show(b.dataset.view)));
$("#pasteBtn").addEventListener("click", pasteAndGo);
$("#fab").addEventListener("click", pasteAndGo);
$("#url").addEventListener("input", () => ($("#urlGo").disabled = !isUrl($("#url").value)));
$("#urlForm").addEventListener("submit", (e) => { e.preventDefault(); startDownload($("#url").value); });
$("#openFolder").addEventListener("click", () => api("/api/open-folder", {}));
// Ctrl+V em qualquer lugar da janela (fora do campo de texto) já baixa.
document.addEventListener("paste", (e) => {
  if (e.target.closest("input, textarea")) return;
  const text = e.clipboardData.getData("text").trim();
  if (text) { e.preventDefault(); startDownload(text); }
});

loadPreset();
loadSettings().then(() => {
  const preset = new URLSearchParams(location.search).get("url");
  if (preset) startDownload(preset);
});
poll();
</script>
</body>
</html>
